# Sample deploy for the published image. The database stays external;
# point the application to it via .env (DB_HOSTNAME, DB_USERNAME, ...).
#
# Traefik is assumed to be running on the host. Adjust:
#   - networks.traefik-public.name  -> your real Traefik network
#   - Host(`...`) rule + certresolver
#
# The image is published by .github/workflows/docker-publish.yml.
# Set DIAS_ONLINE_IMAGE to pin a release, for example:
# ghcr.io/nmwclinic/dias-online:1.2.0
services:
  app:
    image: ghcr.io/nmwclinic/dias-online:latest
    env_file: .env
    restart: unless-stopped
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      # Replace with the real domain
      - "traefik.http.routers.dias-online.rule=Host(`dias-online.example.com`)"
      - "traefik.http.routers.dias-online.entrypoints=websecure"
      - "traefik.http.routers.dias-online.tls.certresolver=myresolver"
      - "traefik.http.services.dias-online.loadbalancer.server.port=80"

networks:
  traefik-public:
    external: true
    name: traefik-public # <- change to the actual Traefik network name
